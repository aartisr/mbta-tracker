<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12347a" />
    <title>MBTA Tracker is offline</title>
    <style>
      :root { color: #0f172a; background: #f4f7fb; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 32rem; padding: 2rem; background: #fff; border: 1px solid #dbe4ef; border-radius: 1.25rem; box-shadow: 0 16px 40px rgba(15, 23, 42, .1); }
      p { color: #475569; line-height: 1.55; }
      a { display: inline-block; border-radius: .7rem; background: #1d4ed8; color: #fff; padding: .75rem 1rem; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p aria-hidden="true">MBTA Tracker</p>
      <h1>You’re offline</h1>
      <p>Reconnect to load live arrivals, alerts, routes, and nearby-stop results. Previously opened app pages may still be available.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
